<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1500px; height: 1000px; }
  #card { width: 1500px; height: 1000px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(circle at 50% 46%, #331a09 0%, #1c0f16 44%, #0b0711 72%, #05030a 100%); }
  .word { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-weight: 800;
    font-size: 210px; letter-spacing: 16px; line-height: 1; margin-top: 8px;
    background: linear-gradient(180deg, #ffe08a 0%, #ff9a3a 52%, #ff5a1e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 40px rgba(255,138,43,0.55)); padding-right: 16px; }
  .tag { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-weight: 700;
    font-size: 34px; letter-spacing: 9px; color: #d9b48a; opacity: 0.9; text-transform: uppercase; }
</style></head><body>
<div id="card">
  <svg width="330" height="420" viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="o" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#ff3d0a"/><stop offset="60%" stop-color="#ff6a1e"/><stop offset="100%" stop-color="#ff8a2b"/></linearGradient>
      <linearGradient id="m" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#ff8a2b"/><stop offset="100%" stop-color="#ffc24a"/></linearGradient>
      <linearGradient id="c" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#ffd24a"/><stop offset="100%" stop-color="#fff6df"/></linearGradient>
      <filter id="g" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="20"/></filter>
    </defs>
    <path d="M150 40 C 262 190, 274 300, 150 356 C 26 300, 38 190, 150 40 Z" fill="#ff6a1e" filter="url(#g)" opacity="0.85"/>
    <path d="M150 34 C 250 176, 264 300, 150 352 C 36 300, 50 176, 150 34 Z" fill="url(#o)"/>
    <path d="M150 130 C 214 232, 220 300, 150 344 C 80 300, 86 232, 150 130 Z" fill="url(#m)"/>
    <path d="M150 206 C 190 268, 192 312, 150 340 C 108 312, 110 268, 150 206 Z" fill="url(#c)"/>
    <circle cx="150" cy="20" r="7" fill="#ffd27a"/><circle cx="120" cy="60" r="5" fill="#ffb45a"/><circle cx="182" cy="54" r="5" fill="#ffc46a"/>
  </svg>
  <div class="word">EMBER</div>
  <div class="tag">Survive the Dark</div>
</div>
</body></html>
