<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  * { margin: 0; padding: 0; }
  html, body { width: 1024px; height: 1024px; }
  #icon { width: 1024px; height: 1024px; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 60%, #2e1708 0%, #1a0e14 46%, #0a0610 74%, #05030a 100%); }
</style></head><body>
<div id="icon">
  <svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="glow" cx="50%" cy="58%" r="50%">
        <stop offset="0%" stop-color="#ff9a3a" stop-opacity="0.85"/>
        <stop offset="40%" stop-color="#ff6a1e" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#ff6a1e" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="outer" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#ff3d0a"/>
        <stop offset="60%" stop-color="#ff6a1e"/>
        <stop offset="100%" stop-color="#ff8a2b"/>
      </linearGradient>
      <linearGradient id="mid" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#ff8a2b"/>
        <stop offset="100%" stop-color="#ffc24a"/>
      </linearGradient>
      <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#ffd24a"/>
        <stop offset="100%" stop-color="#fff6df"/>
      </linearGradient>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
      <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>

    <!-- warm ground glow -->
    <ellipse cx="512" cy="640" rx="470" ry="470" fill="url(#glow)"/>
    <!-- lit ground ring -->
    <ellipse cx="512" cy="742" rx="300" ry="86" fill="none" stroke="#ffb060" stroke-opacity="0.16" stroke-width="6"/>

    <!-- logs -->
    <g>
      <rect x="356" y="706" width="312" height="46" rx="23" fill="#3a2416" transform="rotate(16 512 729)"/>
      <rect x="356" y="706" width="312" height="46" rx="23" fill="#4a2f18" transform="rotate(-16 512 729)"/>
    </g>

    <!-- flame glow -->
    <path d="M512 250 C 660 470, 672 626, 512 726 C 352 626, 364 470, 512 250 Z" fill="#ff6a1e" filter="url(#soft)" opacity="0.9"/>
    <!-- outer flame -->
    <path d="M512 236 C 648 452, 664 626, 512 720 C 360 626, 376 452, 512 236 Z" fill="url(#outer)"/>
    <!-- mid flame -->
    <path d="M512 350 C 604 500, 612 622, 512 700 C 412 622, 420 500, 512 350 Z" fill="url(#mid)"/>
    <!-- core -->
    <path d="M512 452 C 566 548, 570 630, 512 688 C 454 630, 458 548, 512 452 Z" fill="url(#core)" filter="url(#soft2)"/>

    <!-- rising embers -->
    <circle cx="512" cy="214" r="9" fill="#ffd27a"/>
    <circle cx="470" cy="262" r="6" fill="#ffb45a"/>
    <circle cx="556" cy="252" r="7" fill="#ffc46a"/>
    <circle cx="500" cy="176" r="5" fill="#ffe0a0"/>
    <circle cx="540" cy="196" r="4" fill="#ffe0a0"/>
  </svg>
</div>
</body></html>
