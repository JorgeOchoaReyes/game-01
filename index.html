<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#06040c" />
<title>Ember — a survival prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E" />
<style>
/* ===== Ember 3D — layout & DOM HUD ===== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --ember: #ff8a2b; --ember-hot: #ffd24a; --ash: #b7a99b;
  --cold: #5fd0ff; --panel: rgba(18, 12, 20, 0.86);
  --panel-edge: rgba(255, 160, 70, 0.28); --danger: #ff5a6a;
}

html, body {
  width: 100%; height: 100%; background: #04030a; overflow: hidden;
  font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
  color: #f3e9df; user-select: none; -webkit-user-select: none;
  touch-action: none; overscroll-behavior: none;
}

#stage {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(100vw, 56.25vh); height: min(177.78vw, 100vh);
  background: #06040c; overflow: hidden; box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
}
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* full-screen tint overlays (cold, feed flash, dark vignette) */
.tint { position: absolute; inset: 0; pointer-events: none; }
#vignette { box-shadow: inset 0 0 180px 40px rgba(0,0,0,0.85); }
#cold { background: radial-gradient(circle at 50% 62%, rgba(60,160,255,0) 40%, rgba(60,160,255,0.35) 100%); opacity: 0; }
#flash { background: rgba(255,220,120,0.6); opacity: 0; }
#hurt { background: radial-gradient(circle at 50% 55%, rgba(255,40,40,0) 40%, rgba(200,0,0,0.62) 100%); opacity: 0; transition: opacity 0.06s; }

/* ---- top HUD ---- */
#hud { position: absolute; top: 0; left: 0; right: 0; padding: 12px 14px 10px;
  background: linear-gradient(180deg, rgba(8,5,12,0.82), rgba(8,5,12,0)); pointer-events: none; }
.hud-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.hud-top .night { font-size: 21px; font-weight: 800; letter-spacing: 1px; }
.hud-top .phase { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
.phase.dark { color: #ff9d6a; } .phase.dawn { color: #8affc1; }

.phasebar { height: 4px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; margin-bottom: 8px; }
.phasebar > i { display: block; height: 100%; width: 100%; transform-origin: left; }
.phasebar.dark > i { background: #ff6a4a; } .phasebar.dawn > i { background: #6ad0a0; }

.meter { position: relative; height: 20px; border-radius: 6px; background: rgba(0,0,0,0.45);
  overflow: hidden; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.14); }
.meter > i { position: absolute; inset: 0; transform-origin: left; }
.meter.fire > i { background: linear-gradient(90deg, #ff8a2b, #ffd24a); }
.meter.warmth { height: 16px; } .meter.warmth > i { background: linear-gradient(90deg, #5fd0ff, #bfeeff); }
.meter span { position: absolute; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
.meter .lbl { left: 8px; } .meter .val { right: 8px; font-variant-numeric: tabular-nums; }

.woodrow { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; font-weight: 700; margin-top: 3px; }
.woodrow .bank { color: #e0aa6a; }
.carrywrap { display: inline-flex; align-items: center; gap: 7px; transform-origin: right center; }
.carrywrap > em { font-size: 11px; font-style: normal; letter-spacing: 1px; color: var(--ash); }
.pips { display: inline-flex; gap: 3px; }
.pip { width: 10px; height: 13px; border-radius: 2px; border: 1.5px solid rgba(201,138,74,0.55); background: transparent; }
.pip.on { background: linear-gradient(180deg, #e0a866, #b5793f); border-color: #e0a866; box-shadow: 0 0 5px rgba(224,168,102,0.5); }
.carrywrap.full .pip.on { background: linear-gradient(180deg, #ffe08a, #ff9d3a); border-color: #ffe08a; box-shadow: 0 0 7px rgba(255,190,90,0.8); }
.carrywrap.full > em { color: var(--ember-hot); }
@keyframes carrypop { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }
.carrywrap.pop { animation: carrypop 0.26s ease-out; }

/* ---- active ability buffs ---- */
#buffs { position: absolute; top: 128px; left: 14px; right: 14px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.buff { position: relative; display: flex; align-items: center; gap: 5px; padding: 4px 9px 6px; border: 1px solid #fff;
  border-radius: 9px; background: rgba(14, 9, 18, 0.82); overflow: hidden; }
.buff > span { font-size: 15px; }
.buff > em { font-size: 11px; font-weight: 700; font-style: normal; letter-spacing: 0.3px; color: #f3e9df; }
.buff > i { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; transform-origin: left; }

/* ---- banner + warning ---- */
#banner { position: absolute; top: 30%; left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.25s; }
#banner .main { font-size: 40px; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 12px rgba(0,0,0,0.85); }
#banner .sub { font-size: 16px; font-weight: 600; color: #f3e9df; margin-top: 4px; text-shadow: 0 2px 8px rgba(0,0,0,0.85); }
#warn { position: absolute; left: 0; right: 0; bottom: 168px; text-align: center; pointer-events: none;
  font-size: 20px; font-weight: 800; color: var(--danger); text-shadow: 0 2px 8px rgba(0,0,0,0.8); opacity: 0; }
#packhint { position: absolute; left: 0; right: 0; bottom: 198px; text-align: center; pointer-events: none;
  font-size: 16px; font-weight: 800; color: var(--ember-hot); text-shadow: 0 2px 8px rgba(0,0,0,0.85); opacity: 0; }

/* ---- joystick ---- */
#stick { position: absolute; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%;
  border: 3px solid rgba(255,206,138,0.5); pointer-events: none; opacity: 0; }
#stick > i { position: absolute; top: 50%; left: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
  border-radius: 50%; background: rgba(255,206,138,0.5); }

/* ---- dock ---- */
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.dock-row { display: flex; gap: 6px; justify-content: center; }
.docklabel { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--ash); pointer-events: none; padding-bottom: 2px; }
.btn { pointer-events: auto; flex: 1 1 0; min-height: 52px; border: 1px solid var(--panel-edge); border-radius: 12px;
  background: var(--panel); color: #f3e9df; font-size: 13px; font-weight: 700; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; line-height: 1.1; transition: transform 0.06s, background 0.1s, opacity 0.1s; }
.btn:active { transform: scale(0.94); }
.btn .cost { font-size: 11px; font-weight: 600; color: var(--ash); }
.btn .lvl { font-size: 10px; font-weight: 600; color: var(--ember-hot); }
.btn.feed { background: linear-gradient(180deg, rgba(255,138,43,0.34), rgba(120,40,10,0.55));
  border-color: rgba(255,180,90,0.55); color: #fff2df; font-size: 15px; min-height: 56px; }
.btn.disabled { opacity: 0.4; }
.btn.flash { background: rgba(255,210,74,0.55); }
@keyframes feedpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,120,40,0); } 50% { box-shadow: 0 0 18px 2px rgba(255,150,60,0.75); } }
.btn.feed.attn { animation: feedpulse 0.9s ease-in-out infinite; border-color: #ffb04a; }

/* ---- menu screens ---- */
.screen { position: absolute; inset: 0; pointer-events: auto; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 13px;
  background: radial-gradient(circle at 50% 42%, rgba(40,18,8,0.5), rgba(4,3,8,0.93) 72%); }
.screen h1 { font-size: 46px; letter-spacing: 5px; color: var(--ember); text-shadow: 0 0 24px rgba(255,138,43,0.7); }
.screen h2 { font-size: 26px; color: #fff2df; }
.screen p { font-size: 15px; max-width: 300px; line-height: 1.5; color: #d9cdbf; }
.screen .stat { font-size: 15px; color: var(--ember-hot); }
.screen .big { pointer-events: auto; margin-top: 8px; padding: 15px 40px; border-radius: 40px;
  border: 1px solid rgba(255,180,90,0.6); background: linear-gradient(180deg, rgba(255,138,43,0.92), rgba(190,70,20,0.95));
  color: #fff; font-size: 20px; font-weight: 800; letter-spacing: 1px; box-shadow: 0 0 34px rgba(255,138,43,0.5); }
.screen .big:active { transform: scale(0.96); }
.screen .restart { pointer-events: auto; margin-top: 2px; padding: 8px 22px; border-radius: 30px;
  border: 1px solid rgba(255,180,90,0.32); background: rgba(30,20,12,0.6); color: #d9cdbf;
  font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
.screen .restart:active { transform: scale(0.96); }
.screen .hint { font-size: 12.5px; color: var(--ash); max-width: 290px; }
.screen.hidden { display: none; }
.legend { display: flex; flex-direction: column; gap: 7px; margin-top: 2px; }
.legend .row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #d9cdbf; }
.legend .dot { width: 15px; height: 15px; border-radius: 4px; flex: 0 0 auto; }
.credit { position: absolute; bottom: 12px; font-size: 11px; color: #6b5f55; }

/* ---- win / lose / level-up moods ---- */
@keyframes screenfade { from { opacity: 0; } to { opacity: 1; } }
@keyframes losefade { 0% { opacity: 0; } 30% { opacity: 0.55; } 100% { opacity: 1; } }
@keyframes winpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

.screen.win { background: radial-gradient(circle at 50% 38%, rgba(255,190,90,0.14), rgba(24,12,4,0.5) 74%); animation: screenfade 0.5s ease-out; }
.screen.win h2 { color: #ffe08a; text-shadow: 0 0 34px rgba(255,205,95,0.85); animation: winpulse 1.2s ease-in-out infinite; }
.screen.lose { background: radial-gradient(circle at 50% 46%, rgba(24,8,10,0.55), rgba(0,0,0,0.98) 68%); animation: losefade 1.6s ease-in forwards; }
.screen.lose h2 { color: #ff5f5f; text-shadow: 0 0 20px rgba(120,0,0,0.6); letter-spacing: 1px; }
.screen.lose p, .screen.lose .stat { color: #8a7d75; }
.screen.levelup { background: radial-gradient(circle at 50% 38%, rgba(60,44,14,0.55), rgba(6,4,10,0.92) 76%); animation: screenfade 0.35s ease-out; }

.score { font-size: 32px; font-weight: 800; color: #ffd24a; text-shadow: 0 0 18px rgba(255,200,80,0.6); font-variant-numeric: tabular-nums; }
.newbest { font-size: 17px; font-weight: 800; color: #2a1400; background: linear-gradient(90deg, #ff8a2b, #ffe08a); padding: 6px 18px; border-radius: 22px; box-shadow: 0 0 24px rgba(255,200,80,0.75); animation: winpulse 0.7s ease-in-out infinite; }

.boons { display: flex; gap: 9px; margin-top: 8px; width: 100%; max-width: 350px; }
.boon { pointer-events: auto; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: 15px 7px; border: 1px solid var(--panel-edge); border-radius: 14px; background: var(--panel); color: #f3e9df;
  transition: transform 0.08s ease, border-color 0.1s, background 0.1s; }
.boon:active { transform: scale(0.95); }
.boon:hover { border-color: #ffb04a; background: rgba(40,26,14,0.9); }
.boon .bi { font-size: 30px; }
.boon .bn { font-size: 14px; font-weight: 800; color: #ffe0a0; }
.boon .bd { font-size: 11px; color: var(--ash); line-height: 1.25; }

.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; top: -22px; width: 9px; height: 15px; border-radius: 2px; animation: conffall linear forwards; }
@keyframes conffall { 0% { transform: translateY(-22px) rotate(0); opacity: 1; } 100% { transform: translateY(1000px) rotate(760deg); opacity: 0.85; } }

/* ---- momentum combo readout ---- */
#combo { position: absolute; right: 14px; top: 38%; text-align: right; pointer-events: none; opacity: 0; transition: opacity 0.18s; }
#combo b { display: block; font-size: 34px; font-weight: 900; color: #ffd24a; line-height: 0.95;
  text-shadow: 0 0 14px rgba(255,150,50,0.85), 0 2px 4px rgba(0,0,0,0.7); transform-origin: right center; }
#combo small { display: block; font-size: 11px; font-weight: 800; letter-spacing: 3px; color: #ffb04a; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
#combo i { display: block; height: 3px; margin: 4px 0 0 auto; width: 66px; background: #ffce54; border-radius: 2px; transform-origin: right; box-shadow: 0 0 6px rgba(255,180,80,0.8); }

/* ---- floating reward text ---- */
#floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater { position: absolute; font-weight: 800; font-size: 16px; white-space: nowrap; will-change: transform, top, opacity;
  text-shadow: 0 2px 5px rgba(0,0,0,0.85), 0 0 10px rgba(0,0,0,0.5); font-variant-numeric: tabular-nums; }

</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
</div>

<!-- third-party library, bundled and referenced by relative path (no CDN) -->
<script src="vendor/three.min.js"></script>

<!-- the whole game, readable and unminified -->
<script>
"use strict";
/*
 * EMBER (3D) — a single-player, portrait survival prototype.
 *
 * Same game as the 2D prototype — the campfire is your light, warmth, currency
 * and weapon — but rendered in 3D with Three.js so the fire is a REAL light that
 * flickers and casts dynamic shadows. The game logic, systems and balance are
 * unchanged from the tuned 2D build; only the presentation layer is different.
 *
 * Core loop: gather wood in the dark -> bank at the fire -> FEED it (fuel = light
 * radius + burn power) or spend on upgrades -> survive escalating nightly waves.
 * Win: survive 5 nights. Lose: the fire dies or you freeze.
 *
 * Game logic runs in a 2D top-down field (x, y). Rendering maps that field onto
 * the ground plane (x -> world x, y -> world z), so the tuned distances, radii
 * and speeds carry over exactly.
 */
var THREE = window.THREE;

// ---------------------------------------------------------------------------
// Field + world mapping
// ---------------------------------------------------------------------------
var VW = 540, VH = 960;
var K = 0.03;                                  // game-units -> world-units
var ARENA = 250;                               // play radius in game units (hard bound)
var CFG = {
  fireX: VW / 2, fireY: VH * 0.60,
  playTop: 132, playBottom: VH - 150,
  fuelMax: 100, warmthMax: 100,
  survivorSpeed: 215, carryBase: 6, gatherTime: 0.65,
  feedPerLog: 4.1, fuelCap: 130, nights: 5, nightLen: 26, dawnLen: 10, bankRadius: 92
};
function wx(gx) { return (gx - CFG.fireX) * K; }
function wz(gy) { return (gy - CFG.fireY) * K; }
function wr(gr) { return gr * K; }

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function TAU() { return Math.PI * 2; }

// ---------------------------------------------------------------------------
// Three.js scene
// ---------------------------------------------------------------------------
var stage = document.getElementById('stage');
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x06040c);
scene.fog = new THREE.FogExp2(0x06040c, 0.05);

var camera = new THREE.PerspectiveCamera(56, 1, 0.1, 100);
var CAM = new THREE.Vector3(0, 13.5, 10.2);
var CAM_LOOK = new THREE.Vector3(0, 0.2, -6.6);   // look well "north" so the fire sits near the bottom and the field opens wide above it
camera.position.copy(CAM);
camera.lookAt(CAM_LOOK);

// The player may roam the whole visible frame (not a small circle). We derive the
// on-screen ground rectangle by raycasting the camera, and clamp/spawn within it.
var BOUND = { x0: 30, x1: 510, y0: 190, y1: 800 };
var _ray = new THREE.Raycaster();
var _groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function _hitGround(nx, ny) { _ray.setFromCamera(new THREE.Vector2(nx, ny), camera); var v = new THREE.Vector3(); return _ray.ray.intersectPlane(_groundPlane, v) ? v : null; }
function computeBounds() {
  var tl = _hitGround(-0.94, 0.7), tr = _hitGround(0.94, 0.7), bl = _hitGround(-0.94, -0.72), br = _hitGround(0.94, -0.72);
  var tc = _hitGround(0, 0.7), bc = _hitGround(0, -0.72);
  if (!tl || !tr || !bl || !br || !tc || !bc) return;
  var xHalf = Math.min(Math.abs(tr.x), Math.abs(br.x), Math.abs(tl.x), Math.abs(bl.x)) - 0.4; // narrowest, so always on-screen
  BOUND.x0 = CFG.fireX - xHalf / K; BOUND.x1 = CFG.fireX + xHalf / K;
  BOUND.y0 = CFG.fireY + tc.z / K + 8; BOUND.y1 = CFG.fireY + bc.z / K - 6; // tc.z (far) < bc.z (near); reach nearly to top & bottom
}

function resize() {
  var r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
  computeBounds();
}
window.addEventListener('resize', resize);
resize();

// lights: dim cold ambient so shadows read as blue-black, plus the fire
var ambient = new THREE.HemisphereLight(0x38406a, 0x0a0812, 0.5);
scene.add(ambient);
var fireLight = new THREE.PointLight(0xff8a3a, 6, 46, 1.25);  // lower decay + longer reach so a healthy fire lights the whole frame
fireLight.position.set(0, 1.2, 0);
fireLight.castShadow = true;
fireLight.shadow.mapSize.set(1024, 1024);
fireLight.shadow.camera.near = 0.2;
fireLight.shadow.camera.far = 22;
fireLight.shadow.bias = -0.004;
scene.add(fireLight);
var moonLight = new THREE.DirectionalLight(0x4a5a86, 0.38);
moonLight.position.set(-6, 12, -4);
scene.add(moonLight);

// ground
var groundMat = new THREE.MeshStandardMaterial({ color: 0x2a2320, roughness: 1 });
var ground = new THREE.Mesh(new THREE.CircleGeometry(34, 56), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
for (var st = 0; st < 16; st++) {
  var stone = new THREE.Mesh(new THREE.DodecahedronGeometry(0.07 + Math.random() * 0.1),
    new THREE.MeshStandardMaterial({ color: 0x39312b, roughness: 1 }));
  var sa = Math.random() * TAU(), sd = 2 + Math.random() * 11;
  stone.position.set(Math.cos(sa) * sd, 0.03, Math.sin(sa) * sd);
  stone.castShadow = true; stone.receiveShadow = true;
  scene.add(stone);
}

// faint arena boundary so the play area's edge is legible
var boundR = wr(ARENA);
var boundary = new THREE.Mesh(new THREE.RingGeometry(boundR - 0.06, boundR + 0.06, 72),
  new THREE.MeshBasicMaterial({ color: 0x6a5a8a, transparent: true, opacity: 0.14, side: THREE.DoubleSide }));
boundary.rotation.x = -Math.PI / 2; boundary.position.y = 0.02; boundary.visible = false; scene.add(boundary);

// fire strength/range ring: sits at the fire's effective edge, grows + brightens
// with fuel so the protected zone (warmth + burn) is always legible
var rangeRing = new THREE.Mesh(new THREE.RingGeometry(0.94, 1.0, 64),
  new THREE.MeshBasicMaterial({ color: 0xff8a2b, transparent: true, opacity: 0.3, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
rangeRing.rotation.x = -Math.PI / 2; rangeRing.position.y = 0.04; scene.add(rangeRing);

// bank drop-zone ring: where you deposit carried wood
var bankRing = new THREE.Mesh(new THREE.RingGeometry(wr(CFG.bankRadius) - 0.05, wr(CFG.bankRadius) + 0.05, 48),
  new THREE.MeshBasicMaterial({ color: 0xffd24a, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
bankRing.rotation.x = -Math.PI / 2; bankRing.position.y = 0.05; scene.add(bankRing);

// low-fuel warning ring on the ground
var warnRing = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.45, 32),
  new THREE.MeshBasicMaterial({ color: 0xff5a6a, transparent: true, opacity: 0, side: THREE.DoubleSide }));
warnRing.rotation.x = -Math.PI / 2; warnRing.position.y = 0.05;
scene.add(warnRing);

// ---------------------------------------------------------------------------
// Fire mesh
// ---------------------------------------------------------------------------
var fireGroup = new THREE.Group(); scene.add(fireGroup);
var logMat = new THREE.MeshStandardMaterial({ color: 0x3a2416, roughness: 1 });
for (var lg = 0; lg < 3; lg++) {
  var log = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.0, 8), logMat);
  log.rotation.z = Math.PI / 2; log.rotation.y = (lg / 3) * Math.PI; log.position.y = 0.1;
  log.castShadow = true; log.receiveShadow = true; fireGroup.add(log);
}
function flameCone(color, rad, h) {
  var m = new THREE.Mesh(new THREE.ConeGeometry(rad, h, 10),
    new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending, depthWrite: false }));
  fireGroup.add(m); return m;
}
var flameOuter = flameCone(0xff5a1e, 0.4, 1.5);
var flameMid = flameCone(0xffab3a, 0.28, 1.2);
var flameCore = flameCone(0xffe9a8, 0.15, 0.8);
var coals = new THREE.Mesh(new THREE.CircleGeometry(0.5, 20),
  new THREE.MeshBasicMaterial({ color: 0xff6a2a, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }));
coals.rotation.x = -Math.PI / 2; coals.position.y = 0.05; fireGroup.add(coals);

// fire embers (rise in y; independent of the ground-plane game particles)
var EMB = 70;
var embGeo = new THREE.BufferGeometry();
var embPos = new Float32Array(EMB * 3);
var embV = [];

// A simple pine group (used for both harvestable trees and the background treeline).
function makePine(seed, foliageMats) {
  var g = new THREE.Group();
  var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, 0.5, 6),
    new THREE.MeshStandardMaterial({ color: 0x5a3d24, roughness: 1 }));
  trunk.position.y = 0.25; trunk.castShadow = true; g.add(trunk);
  var cones = [];
  for (var t = 0; t < 3; t++) {
    var cone = new THREE.Mesh(new THREE.ConeGeometry(0.58 - t * 0.15, 0.7, 8),
      new THREE.MeshStandardMaterial({ color: foliageMats[t], roughness: 1 }));
    cone.position.y = 0.66 + t * 0.38; cone.castShadow = true; cone.receiveShadow = true; g.add(cone); cones.push(cone);
  }
  var sc = 0.7 + (seed % 100) / 100 * 0.3; g.scale.setScalar(sc);
  g.userData.cones = cones;
  return g;
}

// ===========================================================================
//  GAME LOGIC  (ported unchanged from the tuned 2D build)
// ===========================================================================
var Audio2 = (function () {
  var ac = null, master = null, enabled = true;
  function ensure() { if (ac) return; try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.6; master.connect(ac.destination); } catch (e) { enabled = false; } }
  function resume() { ensure(); if (ac && ac.state === 'suspended') ac.resume(); }
  function tone(freq, dur, type, vol, slideTo) {
    if (!enabled) return; ensure(); if (!ac) return;
    var t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, filterFreq) {
    if (!enabled) return; ensure(); if (!ac) return;
    var t = ac.currentTime, n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq || 1200;
    var g = ac.createGain(); g.gain.value = vol || 0.3;
    src.connect(f); f.connect(g); g.connect(master); src.start(t);
  }

  // --- 8-bit background music (pure synth, no audio files — stays offline) ---
  var musicOn = false, mGain = null, mStep = 0, mNext = 0, mTimer = null;
  var M_STEP = 0.17;
  // a looping minor-key chiptune riff (0 = rest)
  var M_MEL = [440, 523.3, 659.3, 523.3, 587.3, 523.3, 440, 0, 392, 440, 523.3, 392, 329.6, 392, 293.7, 0];
  var M_BASS = [110, 0, 110, 0, 87.3, 0, 87.3, 0, 98, 0, 98, 0, 82.4, 0, 110, 0];
  function mBlip(freq, time, type, vol, dur) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, time);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(vol, time + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.connect(g); g.connect(mGain); o.start(time); o.stop(time + dur + 0.03);
  }
  function mSchedule() {
    if (!musicOn || !ac) return;
    while (mNext < ac.currentTime + 0.25) {
      var mel = M_MEL[mStep % M_MEL.length]; if (mel) mBlip(mel, mNext, 'square', 0.06, M_STEP * 0.9);
      var bas = M_BASS[mStep % M_BASS.length]; if (bas) mBlip(bas, mNext, 'triangle', 0.1, M_STEP * 1.7);
      mNext += M_STEP; mStep++;
    }
    mTimer = setTimeout(mSchedule, 55);
  }
  function startMusic() {
    if (!enabled) return; ensure(); if (!ac || musicOn) return;
    musicOn = true;
    if (!mGain) { mGain = ac.createGain(); mGain.gain.value = 0.5; mGain.connect(master); }
    mStep = 0; mNext = ac.currentTime + 0.1; mSchedule();
  }
  function stopMusic() { musicOn = false; if (mTimer) { clearTimeout(mTimer); mTimer = null; } }

  return {
    resume: resume,
    startMusic: startMusic, stopMusic: stopMusic,
    chop: function () { noise(0.12, 0.25, 1600); tone(220, 0.08, 'square', 0.06); },
    fell: function () { noise(0.4, 0.3, 700); tone(120, 0.35, 'sine', 0.14, 55); },
    wood: function () { tone(540, 0.09, 'triangle', 0.16); tone(360, 0.12, 'triangle', 0.1); },
    dump: function () { noise(0.28, 0.22, 900); tone(200, 0.28, 'sawtooth', 0.16, 460); },
    chainsaw: function () { tone(140, 0.18, 'sawtooth', 0.16, 210); tone(90, 0.2, 'square', 0.1, 130); noise(0.14, 0.12, 1800); },
    sling: function () { tone(430, 0.1, 'triangle', 0.14, 760); noise(0.05, 0.06, 2200); },
    supernova: function () { tone(110, 0.8, 'sawtooth', 0.26, 1100); tone(330, 0.6, 'square', 0.14, 1400); noise(0.7, 0.34, 1500); },
    crit: function () { tone(720, 0.1, 'square', 0.14, 980); tone(480, 0.14, 'triangle', 0.12); },
    pickup: function () { [660, 880, 1180].forEach(function (f, i) { setTimeout(function () { tone(f, 0.14, 'triangle', 0.18); }, i * 70); }); },
    sizzle: function () { noise(0.14, 0.06, 2600); },
    feed: function () { tone(180, 0.25, 'sawtooth', 0.18, 420); noise(0.35, 0.28, 900); },
    upgrade: function () { tone(520, 0.12, 'triangle', 0.2); setTimeout(function () { tone(780, 0.18, 'triangle', 0.2); }, 90); },
    shadeDie: function () { noise(0.18, 0.22, 700); tone(90, 0.18, 'sine', 0.12, 40); },
    bite: function () { tone(70, 0.18, 'square', 0.18, 40); noise(0.12, 0.15, 500); },
    hurt: function () { tone(150, 0.16, 'square', 0.18, 60); noise(0.1, 0.16, 480); },
    night: function () { tone(70, 0.9, 'sine', 0.16, 55); },
    dawn: function () { tone(330, 0.3, 'triangle', 0.16); setTimeout(function () { tone(494, 0.4, 'triangle', 0.16); }, 150); },
    lose: function () { tone(200, 1.1, 'sawtooth', 0.22, 45); },
    win: function () { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { tone(f, 0.35, 'triangle', 0.18); }, i * 140); }); }
  };
})();

// Drops unlock as the nights escalate — early nights give the basics, and the rarest,
// most powerful powers only start appearing deeper in a run (a progression hook).
function randomDropType() {
  var pool = ['inferno', 'swift', 'harvest', 'ward', 'inferno', 'swift', 'harvest'];   // tier 1 (common)
  var n = game.night;
  if (n >= 2) pool.push('sling', 'sling', 'nova');
  if (n >= 3) pool.push('telekinesis', 'telekinesis', 'toolbelt', 'humantorch');
  if (n >= 4) pool.push('chainsaw');
  if (n >= 5) pool.push('supernova');
  return pool[Math.floor(rand(0, pool.length))];
}

// Momentum combo: any reward action (chop, crit, kill, feed) keeps a streak alive.
// It multiplies the style-bonus score and drives a HUD readout + milestone flourishes,
// so continuous play is continuously rewarded — the core "keep going" hook.
var COMBO_HOLD = 2.6;
function comboMult() { return 1 + Math.min(game.combo, 40) * 0.05; }   // up to 3x
function bumpCombo(n) {
  game.combo += (n || 1);
  game.comboT = COMBO_HOLD;
  if (game.combo > game.comboBest) game.comboBest = game.combo;
  if (game.combo > 0 && game.combo % 10 === 0) {                        // milestone beat
    setBanner('COMBO ×' + game.combo + ' 🔥', "You're on fire — keep it going!", 1.5);
    addParticles(survivor.x, survivor.y, 20, '#ffd24a', 165, 0.6, 3);
    game.shake = Math.max(game.shake, 5); Audio2.crit();
  }
}

  { icon: '🌟', name: 'Wider Light', desc: 'Fire reaches +15%', apply: function () { game.mods.radius = (game.mods.radius || 0) + 0.15; } },
  { icon: '🎒', name: 'Deep Pack', desc: 'Carry +3 wood', apply: function () { game.mods.carry = (game.mods.carry || 0) + 3; } },
  { icon: '🧥', name: 'Thick Coat', desc: 'Cold −25%', apply: function () { game.mods.cold = (game.mods.cold || 1) * 0.75; } },
  { icon: '💨', name: 'Fleet Foot', desc: 'Move +14%', apply: function () { game.mods.speed = (game.mods.speed || 0) + 0.14; } },
  { icon: '🪓', name: 'Keen Axe', desc: 'Chop 25% faster', apply: function () { game.mods.chop = (game.mods.chop || 1) * 0.75; } },
  { icon: '✨', name: 'Lucky Finds', desc: 'More ability drops', apply: function () { game.mods.drop = (game.mods.drop || 0) + 0.12; } }
];

function loadBest() { try { return parseInt(localStorage.getItem('ember_best') || '0', 10) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('ember_best', String(v)); } catch (e) {} }
function computeScore() {
  var nights = game.state === 'win' ? game.night : (game.night - (game.phase === 'dawn' ? 1 : 0));
  return Math.max(0, nights * 500 + game.shadesBurned * 20 + game.woodPopped * 5 + (game.bonus || 0) + (game.state === 'win' ? 1000 : 0));
}
function setBanner(main, sub, dur) { game.banner = { main: main, sub: sub || '', t: dur || 2.2, max: dur || 2.2 }; }

var survivor = { x: CFG.fireX, y: CFG.fireY + 60, r: 13, face: Math.PI / 2, chill: 0, walk: 0, moving: false, chopping: false, chopT: 0, prevPhase: 0 };
var trees = [], shades = [], particles = [], flares = [], drops = [], tosses = [], floaters = [], projs = [], groundWood = [];
var targetTree = null;   // tree currently in gather range (for highlight/progress UI)

// floating reward text ("+2", "CRIT", "🔥 +18", buff names) — instant, visible payoff
// on every action, anchored to a game-field point and projected to the screen each frame.
function addFloater(gx, gy, text, color, big) {
  floaters.push({ x: gx, y: gy, text: text, color: color || '#ffe9a8', t: 0, life: big ? 1.15 : 0.85, big: !!big });
}

function fireRadius() { return (78 + clamp(game.fuel / CFG.fuelMax, 0, 1) * 120 + UPGRADES.stoke.lvl * 14) * (1 + (game.mods.radius || 0)) * (buffOn('inferno') ? 1.22 : 1); }
function fireIntensity() { return clamp(game.fuel / CFG.fuelMax, 0, 1); }
function carryCap() { return CFG.carryBase + UPGRADES.satchel.lvl * 3 + (game.mods.carry || 0); }
function burnDps() { return (34 + UPGRADES.ashheart.lvl * 12) * (1 + (game.mods.burn || 0)) * (buffOn('inferno') ? 2 : 1); }
function moveSpeed() { return CFG.survivorSpeed * (1 + (game.mods.speed || 0)) * (buffOn('swift') ? 1.6 : 1); }
function gatherTime() { return CFG.gatherTime * (game.mods.chop || 1) * (buffOn('harvest') ? 0.5 : 1); }

function spawnTree() {
  // spread trees across the whole visible frame (top to bottom), off the fire zone,
  // well spaced from each other — the lit, fully-walkable frame keeps them reachable
  for (var tries = 0; tries < 40; tries++) {
    var x = rand(BOUND.x0 + 24, BOUND.x1 - 24), y;
    // most trees grow in the open field ABOVE the fire, skewed toward the near side
    // (close to the fire) so wood is quick to reach; a few grow below
    if (Math.random() < 0.82) {
      var near = CFG.fireY - 55, top = BOUND.y0 + 24;
      y = near - Math.pow(Math.random(), 1.4) * (near - top);   // pow<1 skew -> nearer the fire
    } else {
      y = rand(CFG.fireY + 70, BOUND.y1 - 20);
    }
    if (dist2(x, y, CFG.fireX, CFG.fireY) < 80 * 80) continue;   // keep a small clear zone around the fire
    var ok = true;
    for (var i = 0; i < trees.length; i++) { if (dist2(x, y, trees[i].x, trees[i].y) < 52 * 52) { ok = false; break; } }
    if (!ok) continue;
    trees.push({ x: x, y: y, r: 17, wood: 5, chop: 0, seed: Math.floor(rand(0, 1e6)) });
    return true;
  }
  return false;
}
function spawnShade(hpMul, spdMul, kind) {
  // spawn just outside the frame on a random edge, so they march in on-screen
  var m = 34, x, y, edge = Math.floor(rand(0, 4));
  if (edge === 0) { x = rand(BOUND.x0, BOUND.x1); y = BOUND.y0 - m; }        // top
  else if (edge === 1) { x = rand(BOUND.x0, BOUND.x1); y = BOUND.y1 + m; }   // bottom
  else if (edge === 2) { x = BOUND.x0 - m; y = rand(BOUND.y0, BOUND.y1); }   // left
  else { x = BOUND.x1 + m; y = rand(BOUND.y0, BOUND.y1); }                   // right
  kind = kind || 'shade';
  var hp, r, spd, bite;
  if (kind === 'brute') { hp = 10 * hpMul; r = 19; spd = rand(15, 22) * spdMul; bite = 7; }        // slow, tanky, hits the fire hard
  else if (kind === 'irregular') { hp = 6 * hpMul; r = 13; spd = rand(44, 58) * spdMul; bite = 0; } // hunts the player; torch can't kill it
  else { hp = 3 * hpMul; r = 12; spd = rand(26, 40) * spdMul; bite = 4; }
  shades.push({ x: x, y: y, r: r, hp: hp, maxHp: hp, spd: spd, biteCd: 0, playerBiteCd: 0, wob: rand(0, TAU()), hitFlash: 0, kind: kind, bite: bite });
}
function addParticles(x, y, n, color, spd, life, sz) {
  for (var i = 0; i < n; i++) {
    var a = rand(0, TAU());
    particles.push({ x: x, y: y, vx: Math.cos(a) * rand(0, spd), vy: Math.sin(a) * rand(0, spd) - rand(0, spd * 0.4), life: life * rand(0.6, 1), maxLife: life, color: color, sz: sz || rand(2, 4) });
  }
}

function spawnDrop(x, y, type) {
  // drops always appear FAR from the fire — grabbing one means leaving the safe
  // light and braving the dark (a real risk/reward trek), wherever it was earned
  var thr = 250, dx = x, dy = y;
  for (var i = 0; i < 24; i++) {
    dx = rand(BOUND.x0 + 20, BOUND.x1 - 20); dy = rand(BOUND.y0 + 20, BOUND.y1 - 20);
    if (dist2(dx, dy, CFG.fireX, CFG.fireY) > thr * thr) break;
  }
  drops.push({ x: dx, y: dy, type: type, life: 17, bob: rand(0, TAU()) });
}

function collectDrop(d) {
  var b = BUFFS[d.type];
  var bcol = '#' + b.color.toString(16).padStart(6, '0');
  addParticles(d.x, d.y, 20, bcol, 130, 0.6, 3);
  addFloater(d.x, d.y, b.icon + ' ' + b.name.toUpperCase() + (d.type === 'toolbelt' ? ' +2' : d.type === 'nova' ? '!' : ''), bcol, true);
  if (d.type === 'nova') {
    triggerFlare(fireRadius() * 2.4, 40);            // instant screen-clearing blast
    for (var i = 0; i < shades.length; i++) { shades[i].hp -= 40; shades[i].hitFlash = 0.2; }
    game.flash = Math.max(game.flash, 0.5); game.shake = Math.max(game.shake, 10);
    game.blueFire = 5;                               // the blast burns the fire blue-hot for a moment
  } else if (d.type === 'humantorch') {
    // the survivor bursts into flame: everything NEARBY burns — shades die, trees fell
    // into the fire — but the whole held pack is spent as ignition (the cost)
    var HT = 135;                                    // near radius
    var held = game.carry; game.carry = 0;           // cost: all wood you're carrying
    for (var hi = 0; hi < shades.length; hi++) { var hs = shades[hi]; if (dist2(hs.x, hs.y, survivor.x, survivor.y) < HT * HT) { hs.hp -= 999; hs.hitFlash = 0.3; } }
    var htGot = 0;
    for (var hti = 0; hti < trees.length; hti++) { var htt = trees[hti]; if (!htt.felling && dist2(htt.x, htt.y, survivor.x, survivor.y) < HT * HT) { htGot += htt.wood; htt.wood = 0; htt.felling = 0.5; addParticles(htt.x, htt.y, 16, '#ff9d3a', 175, 0.6, 3); } }
    var htGain = htGot * CFG.feedPerLog;             // burned trees feed the fire (held wood is the price)
    game.fuel = clamp(game.fuel + htGain, 0, CFG.fuelCap);
    if (held > 0) addFloater(survivor.x, survivor.y - 14, '🪵 −' + held, '#ff9d6a', true);
    if (htGain > 0) addFloater(CFG.fireX, CFG.fireY - 24, '🔥 +' + Math.round(htGain), '#ff9d3a', true);
    flares.push({ x: survivor.x, y: survivor.y, r: 20, max: HT * 2.2, dmg: 90, life: 0.6, maxLife: 0.6 });
    game.supernovaT = Math.max(game.supernovaT || 0, 1.1);   // reuse the "survivor ablaze" visual
    game.flash = Math.max(game.flash, 0.6); game.shake = Math.max(game.shake, 12); game.blueFire = Math.max(game.blueFire || 0, 3);
    addParticles(survivor.x, survivor.y, 34, '#ffce54', 240, 0.8, 5);
    Audio2.supernova(); UI.syncDock();
  } else if (d.type === 'supernova') {
    // the survivor ERUPTS into flame — the whole forest burns and every shade dies at once
    flares.push({ x: survivor.x, y: survivor.y, r: 20, max: 1600, dmg: 140, life: 0.7, maxLife: 0.7 });
    for (var si = 0; si < shades.length; si++) { shades[si].hp -= 999; shades[si].hitFlash = 0.3; }
    var felled = 0;
    for (var tri = 0; tri < trees.length; tri++) { var trr = trees[tri]; if (!trr.felling) { felled += trr.wood; trr.wood = 0; trr.felling = 0.5; addParticles(trr.x, trr.y, 22, '#ff9d3a', 190, 0.7, 4); } }
    game.fuel = clamp(game.fuel + felled * 2.2, 0, CFG.fuelCap);   // the burning forest feeds the fire
    if (felled > 0) addFloater(CFG.fireX, CFG.fireY - 24, '🔥 +' + Math.round(felled * 2.2), '#bfe0ff', true);
    game.blueFire = 6; game.flash = Math.max(game.flash, 0.9); game.shake = Math.max(game.shake, 20);
    game.supernovaT = 1.3;                            // the survivor stays ablaze for a beat
    addParticles(survivor.x, survivor.y, 46, '#ffce54', 280, 0.85, 5);
    addParticles(survivor.x, survivor.y, 30, '#bfe0ff', 240, 0.8, 4);
    Audio2.supernova();
  } else if (d.type === 'toolbelt') {
    game.mods.carry = (game.mods.carry || 0) + 2;    // permanent bigger pack
    UI.flashCarry();
  } else {
    game.buffs[d.type] = b.dur;                      // (re)start the timed buff
  }
  Audio2.pickup();
}

function updateDrops(dt) {
  for (var i = drops.length - 1; i >= 0; i--) {
    var d = drops[i]; d.life -= dt; d.bob += dt * 3;
    if (dist2(d.x, d.y, survivor.x, survivor.y) < Math.pow(survivor.r + 20, 2)) { collectDrop(d); drops.splice(i, 1); continue; }
    if (d.life <= 0) drops.splice(i, 1);
  }
  for (var k in game.buffs) { if (game.buffs[k] > 0) { game.buffs[k] -= dt; if (game.buffs[k] <= 0) game.buffs[k] = 0; } }
}

// dropped wood (knocked loose by irregulars) can be walked over to reclaim, if the pack has room
function updateGroundWood(dt) {
  var cap = carryCap();
  for (var i = groundWood.length - 1; i >= 0; i--) {
    var w = groundWood[i]; w.life -= dt; w.bob += dt * 3; if (w.grab > 0) w.grab -= dt;
    if (w.grab <= 0 && game.carry < cap && dist2(w.x, w.y, survivor.x, survivor.y) < Math.pow(survivor.r + 18, 2)) {
      game.carry++; groundWood.splice(i, 1); Audio2.wood(); addFloater(w.x, w.y, '+1', '#ffd9a0'); UI.flashCarry(); UI.syncDock(); continue;
    }
    if (w.life <= 0) groundWood.splice(i, 1);
  }
}

function startGame() {
  game.state = 'play'; game.time = 0;
  game.fuel = 65; game.warmth = 100; game.carry = 0;
  game.night = 1; game.phase = 'dawn'; game.phaseTime = CFG.dawnLen;
  game.woodPopped = 0; game.shadesBurned = 0; game.shake = 0; game.lowFuelWarn = 0; game.flash = 0;
  survivor.x = CFG.fireX; survivor.y = CFG.fireY - 55; survivor.chill = 0;
  trees.length = 0; shades.length = 0; particles.length = 0; flares.length = 0; drops.length = 0; tosses.length = 0; floaters.length = 0; projs.length = 0; groundWood.length = 0; game.dumpFlash = 0;
  game.combo = 0; game.comboT = 0; game.comboBest = 0; game.bonus = 0; game.endless = false; game.slingCd = 0; game.biteFloatCd = 0; game.blueFire = 0; game.tkCd = 0; game.supernovaT = 0; game.hurt = 0; game.hurtSndCd = 0;
  for (var k in UPGRADES) UPGRADES[k].lvl = 0;
  game.buffs = {}; game.treeTimer = 0; game.mods = {}; game.endT = 0; game.isBest = false;
  game.banner = null; game.tipShown = false;
  for (var i = 0; i < 6; i++) spawnTree();
  setBanner('DAWN', 'Chop wood, then FEED the fire', 3.4);
  UI.showScreen(null); UI.syncDock();
  Audio2.startMusic();
}
function endGame(win) {
  game.state = win ? 'win' : 'over';
  game.endT = 0;
  if (!win) { game.hurt = 1.3; game.shake = Math.max(game.shake, 18); }   // a hard, clear death hit
  game.lastScore = computeScore();
  var best = loadBest();
  game.isBest = game.lastScore > best;
  game.bestScore = game.isBest ? game.lastScore : best;
  if (game.isBest) saveBest(game.lastScore);
  shades.length = 0; drops.length = 0; floaters.length = 0; projs.length = 0; groundWood.length = 0; game.combo = 0;   // clear the stage for the end scene
  if (win) { game.fuel = CFG.fuelMax; game.buffs = {}; }  // a roaring victory fire
  Audio2.stopMusic();
  if (win) Audio2.win(); else Audio2.lose();
  UI.showResult(win);
}

// After the first 5-night clear the player may keep going: nights escalate forever,
// the run ends only in death, and the score keeps climbing — the endless replay hook.
// Upgrades and boons are kept; the fire is restoked and the stage reset for a fresh dawn.
function continueEndless() {
  game.endless = true; game.state = 'play';
  game.night = CFG.nights + 1; game.phase = 'dawn'; game.phaseTime = CFG.dawnLen;
  game.fuel = clamp(game.fuel, 55, CFG.fuelCap); game.warmth = CFG.warmthMax; game.buffs = {};
  game.endT = 0; game.nightSpawnAcc = 0; game.combo = 0; game.comboT = 0;
  survivor.x = CFG.fireX; survivor.y = CFG.fireY - 55; survivor.chill = 0;
  shades.length = 0; drops.length = 0; floaters.length = 0; particles.length = 0; projs.length = 0; groundWood.length = 0;
  var living = 0; for (var i = 0; i < trees.length; i++) if (!trees[i].felling) living++;
  for (var s = living; s < 6; s++) spawnTree();
  spawnDrop(CFG.fireX + rand(-60, 60), CFG.fireY - rand(50, 100), randomDropType());
  setBanner('ENDLESS NIGHTS', 'They no longer end — how long can you last?', 3.2);
  UI.showScreen(null); UI.syncDock();
}

// present the between-nights boon pick (the "level up" beat)
function startLevelUp() {
  var pool = BOONS.slice();
  game.boons = [];
  for (var i = 0; i < 3 && pool.length; i++) game.boons.push(pool.splice(Math.floor(rand(0, pool.length)), 1)[0]);
  game.state = 'levelup';
  floaters.length = 0; projs.length = 0; groundWood.length = 0; game.combo = 0;
  Audio2.dawn();
  UI.showLevelUp();
}
function pickBoon(idx) {
  var b = game.boons[idx];
  if (b) { b.apply(); Audio2.upgrade(); addParticles(survivor.x, survivor.y, 20, '#8affc1', 130, 0.7, 3); }
  game.state = 'play';
  spawnDrop(CFG.fireX + rand(-60, 60), CFG.fireY - rand(50, 100), randomDropType());
  setBanner('DAWN', 'Night ' + (game.night - 1) + ' survived — stock up', 2.6);
  UI.showScreen(null); UI.syncDock();
}
function triggerFlare(radius, dmg) {
  flares.push({ x: CFG.fireX, y: CFG.fireY, r: 20, max: radius, dmg: dmg, life: 0.45, maxLife: 0.45 });
  addParticles(CFG.fireX, CFG.fireY, 22, '#ffce54', 220, 0.5, 4);
}
// Upgrades cost the fire's own fuel — a real trade-off: dip the fire now for lasting power.
function buyUpgrade(key) {
  if (game.state !== 'play') return;
  var u = UPGRADES[key]; if (u.lvl >= u.max) return;
  var cost = upgradeCost(u); if (game.fuel < cost) return;
  game.fuel -= cost; u.lvl++;
  game.shake = Math.max(game.shake, 3);
  Audio2.upgrade(); addParticles(survivor.x, survivor.y, 16, '#8affc1', 120, 0.6, 3);
  addFloater(survivor.x, survivor.y - 22, u.name + ' Lv' + u.lvl, '#8affc1', true);
  UI.syncDock(); UI.flashBtn(key);
}

function update(dt) {
  if (game.state !== 'play') {
    if (game.state === 'win' || game.state === 'over') game.endT += dt;
    if (game.hurt > 0) game.hurt -= dt;                              // death flash fades over the end scene
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 22);
    updateParticles(dt);
    return;
  }
  game.time += dt;
  game.phaseTime -= dt;
  if (game.phase === 'dawn') {
    if (game.phaseTime <= 0) { game.phase = 'night'; game.phaseTime = CFG.nightLen; game.nightSpawnAcc = 0; setBanner('NIGHT ' + game.night, 'The dark comes — keep it burning', 2.4); Audio2.night(); }
  } else {
    var hpMul = 1 + (game.night - 1) * 0.7, spdMul = 1 + (game.night - 1) * 0.12;
    var ratePerSec = Math.min(0.3 + game.night * 0.26, 5.5);            // denser waves the deeper you go (capped for perf)
    var bruteChance = game.night >= 3 ? Math.min(0.15 + (game.night - 3) * 0.1, 0.5) : 0;
    var irregChance = game.night >= 3 ? Math.min(0.1 + (game.night - 3) * 0.035, 0.22) : 0;   // player-hunting irregulars (from night 3)
    game.nightSpawnAcc = (game.nightSpawnAcc || 0) + dt * ratePerSec;
    while (game.nightSpawnAcc >= 1) {
      if (shades.length < 100) {   // soft cap keeps late endless waves renderable
        var roll = Math.random(), kind = 'shade';
        if (roll < bruteChance) kind = 'brute';
        else if (roll < bruteChance + irregChance) kind = 'irregular';
        spawnShade(hpMul, spdMul, kind);
      }
      game.nightSpawnAcc -= 1;
    }
    if (game.phaseTime <= 0) {
      if (game.night >= CFG.nights && !game.endless) { endGame(true); return; }   // first-clear milestone (then optional endless)
      game.night++; game.phase = 'dawn'; game.phaseTime = CFG.dawnLen;
      shades.length = 0; addParticles(CFG.fireX, CFG.fireY, 34, '#ffd24a', 170, 0.9, 4);
      startLevelUp();   // pause for a boon pick, then resume dawn
      return;
    }
  }
  // combo streak fades if you stop acting
  if (game.comboT > 0) { game.comboT -= dt; if (game.comboT <= 0) { game.comboT = 0; game.combo = 0; } }
  if (game.biteFloatCd > 0) game.biteFloatCd -= dt;   // throttles the fire-drain popup
  if (game.blueFire > 0) game.blueFire -= dt;         // Nova's temporary blue-hot fire
  if (game.supernovaT > 0) { game.supernovaT -= dt; if (Math.random() < dt * 45) addParticles(survivor.x, survivor.y, 2, '#ffce54', 210, 0.6, 4); }  // survivor ablaze
  if (game.hurt > 0) game.hurt -= dt;                 // red damage flash fades
  if (game.hurtSndCd > 0) game.hurtSndCd -= dt;
  // floating reward text rises + fades
  for (var flo = floaters.length - 1; flo >= 0; flo--) { floaters[flo].t += dt; if (floaters[flo].t >= floaters[flo].life) floaters.splice(flo, 1); }

  var decay = 1.2 + game.night * 0.33 + (game.phase === 'night' ? 1.5 : 0);
  game.fuel -= decay * dt;
  if (game.fuel <= 0) { game.fuel = 0; endGame(false); return; }
  game.lowFuelWarn = game.fuel < 22 ? (game.lowFuelWarn + dt) : 0;

  var dir = keyboardDir(), mvx = 0, mvy = 0, mag = 0;
  if (dir) { mvx = dir.dx; mvy = dir.dy; mag = dir.mag; }
  else if (input.active) { mvx = input.dx; mvy = input.dy; mag = input.mag; }
  survivor.moving = mag > 0.05;
  if (survivor.moving) {
    survivor.x += mvx * moveSpeed() * mag * dt;
    survivor.y += mvy * moveSpeed() * mag * dt;
    survivor.face = Math.atan2(mvy, mvx); survivor.walk += dt * (6 + mag * 6);
  }
  // keep the survivor inside the visible frame (roam anywhere on-screen)
  survivor.x = clamp(survivor.x, BOUND.x0, BOUND.x1);
  survivor.y = clamp(survivor.y, BOUND.y0, BOUND.y1);
  // solid trees: push the survivor out of any trunk it overlaps (no walking through)
  for (var ck = 0; ck < trees.length; ck++) {
    var ct = trees[ck];
    if (ct.felling) continue;                          // walk through a toppling tree
    var cx = survivor.x - ct.x, cy = survivor.y - ct.y, cd = Math.hypot(cx, cy);
    var minD = survivor.r + ct.r * 0.7;
    if (cd < minD) {
      if (cd < 0.001) { cx = 1; cy = 0; cd = 1; }   // dead-centre: pick a direction
      survivor.x = ct.x + cx / cd * minD; survivor.y = ct.y + cy / cd * minD;
    }
  }

  var litByFire = dist2(survivor.x, survivor.y, CFG.fireX, CFG.fireY) < Math.pow(fireRadius(), 2);
  var warmthRate;
  if (litByFire) warmthRate = 22;
  else if (buffOn('ward')) warmthRate = 0;   // Ward: immune to the cold
  else { var coldBase = 5.5 + game.night * 0.8 + (game.phase === 'night' ? 2.2 : 0); warmthRate = -coldBase * (1 - UPGRADES.coat.lvl * 0.12) * (game.mods.cold || 1); }
  game.warmth = clamp(game.warmth + warmthRate * dt, 0, CFG.warmthMax);
  survivor.chill = 1 - game.warmth / CFG.warmthMax;
  if (game.warmth <= 0) { endGame(false); return; }

  var near = null, nearD = 1e9;
  for (var i = 0; i < trees.length; i++) {
    var tt = trees[i];
    if (tt.felling) continue;                         // a toppling tree can't be chopped
    var d = dist2(survivor.x, survivor.y, tt.x, tt.y);
    if (d < Math.pow(tt.r + survivor.r + 20, 2) && d < nearD) { near = tt; nearD = d; }
  }
  targetTree = near;
  survivor.chopping = false;
  game.packFull = false;

  // nearest shade within torch reach — the same swing that chops wood beats these back
  var meleeShade = null, meleeD = 1e9;
  for (var mi = 0; mi < shades.length; mi++) {

    showScreen(nodes, win ? 'win' : 'lose');

    var target = game.lastScore, cur = 0, step = Math.max(1, Math.round(target / 40));
    countTimer = setInterval(function () { cur = Math.min(target, cur + step); scoreEl.textContent = '★ ' + cur; if (cur >= target) { clearInterval(countTimer); countTimer = null; } }, 28);
  }
  function syncDock() {
    Object.keys(UPGRADES).forEach(function (key) {
      var u = UPGRADES[key], b = upBtns[key], maxed = u.lvl >= u.max, cost = upgradeCost(u);
      b.classList.toggle('disabled', maxed || game.fuel < cost);
      b.querySelector('.cost').textContent = maxed ? 'MAX' : ('🔥 ' + cost);
      b.querySelector('.lvl').textContent = 'Lv ' + u.lvl + '/' + u.max;
    });
  }
  function flashBtn(id) { var b = upBtns[id]; if (!b) return; b.classList.add('flash'); setTimeout(function () { b.classList.remove('flash'); }, 120); }
  function flashCarry() { elCarryWrap.classList.remove('pop'); void elCarryWrap.offsetWidth; elCarryWrap.classList.add('pop'); }

  function updateHUD() {
    hurt.style.opacity = game.hurt > 0 ? clamp(game.hurt, 0, 1) * 0.85 : 0;   // red damage flash (also on death)
    if (game.state !== 'play') return;
    elNight.textContent = game.endless ? ('NIGHT ' + game.night + ' ∞') : ('NIGHT ' + game.night + ' / ' + CFG.nights);
    var isNight = game.phase === 'night';
    elPhase.textContent = (isNight ? 'DARK  ' : 'DAWN  ') + Math.ceil(game.phaseTime) + 's';
    elPhase.className = 'phase ' + (isNight ? 'dark' : 'dawn');
    elPhaseBar.className = 'phasebar ' + (isNight ? 'dark' : 'dawn');
    var full = isNight ? CFG.nightLen : CFG.dawnLen;
    elPhaseFill.style.transform = 'scaleX(' + clamp(game.phaseTime / full, 0, 1) + ')';
    elFire.style.transform = 'scaleX(' + clamp(game.fuel / CFG.fuelMax, 0, 1) + ')';
    elFireVal.textContent = Math.round(game.fuel);
    elWarm.style.transform = 'scaleX(' + clamp(game.warmth / CFG.warmthMax, 0, 1) + ')';
    elWarmVal.textContent = Math.round(game.warmth);
    var cap = carryCap();
    var pipKey = game.carry + '/' + cap;
    if (elPips._key !== pipKey) {
      elPips._key = pipKey;
      var ph = '';
      for (var pi = 0; pi < cap; pi++) ph += '<i class="pip' + (pi < game.carry ? ' on' : '') + '"></i>';
      elPips.innerHTML = ph;
      elCarryWrap.classList.toggle('full', game.carry >= cap);
    }

    // banner
    if (game.banner) { var b = game.banner, k = b.t / b.max, a = clamp(k < 0.25 ? k / 0.25 : (k > 0.85 ? (1 - k) / 0.15 : 1), 0, 1); banner.style.opacity = a; bMain.textContent = b.main; bMain.style.color = isNight ? '#ff9d6a' : '#ffe08a'; bSub.textContent = b.sub; }
    else banner.style.opacity = 0;
    // warning
    warn.style.opacity = game.fuel < 22 ? (0.55 + 0.45 * Math.sin(game.time * 9)) : 0;
    // pack-full nudge (why chopping "does nothing")
    packhint.style.opacity = game.carry >= carryCap() ? (0.7 + 0.3 * Math.sin(game.time * 5)) : 0;
    // momentum combo readout — appears once a streak is building, heats up as it grows
    if (game.combo >= 3) {
      combo.style.opacity = 1;
      var heat = Math.min(1, game.combo / 25);
      comboNum.textContent = '×' + game.combo;
      comboNum.style.transform = 'scale(' + (1 + heat * 0.6) + ')';
      comboNum.style.color = 'rgb(255,' + Math.round(214 - heat * 96) + ',' + Math.round(74 + heat * 24) + ')';
      comboBar.style.transform = 'scaleX(' + clamp(game.comboT / COMBO_HOLD, 0, 1) + ')';
    } else combo.style.opacity = 0;
    // active ability buffs
    var bh = '';
    for (var bk in game.buffs) {
      if (game.buffs[bk] > 0) {
        var bm = BUFFS[bk], frac = clamp(game.buffs[bk] / bm.dur, 0, 1);
        bh += '<div class="buff" style="border-color:#' + bm.color.toString(16).padStart(6, '0') + '"><span>' + bm.icon + '</span><em>' + bm.name + '</em><i style="transform:scaleX(' + frac + ');background:#' + bm.color.toString(16).padStart(6, '0') + '"></i></div>';
      }
    }
    if (buffbar.innerHTML !== bh) buffbar.innerHTML = bh;
    else { var bars = buffbar.querySelectorAll('.buff > i'), n = 0; for (var bk2 in game.buffs) { if (game.buffs[bk2] > 0 && bars[n]) { bars[n].style.transform = 'scaleX(' + clamp(game.buffs[bk2] / BUFFS[bk2].dur, 0, 1) + ')'; n++; } } }
    // tints
    cold.style.opacity = survivor.chill > 0.15 ? (survivor.chill * 0.9) : 0;
    flash.style.opacity = game.flash > 0 ? game.flash * 0.7 : 0;
    // joystick
    if (input.active) { stick.style.opacity = 0.6; stick.style.left = input.ox + 'px'; stick.style.top = input.oy + 'px'; stickNub.style.transform = 'translate(' + (input.x - input.ox) + 'px,' + (input.y - input.oy) + 'px)'; }
    else stick.style.opacity = 0;
  }

  return { showScreen: showScreen, showTitle: showTitle, showResult: showResult, showLevelUp: showLevelUp, syncDock: syncDock, flashBtn: flashBtn, flashCarry: flashCarry, updateHUD: updateHUD, syncFloaters: syncFloaters };
})();

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
resize();
UI.showTitle();
var clock = new THREE.Clock();
function frame() {
  var dt = Math.min(0.05, clock.getDelta());
  update(dt);
  renderScene(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// debug hook for the headless harness
window.__EMBER = {
  game: game, survivor: survivor, trees: trees, shades: shades, drops: drops, projs: projs, groundWood: groundWood, input: input,
  cfg: CFG, upgrades: UPGRADES, buffs: BUFFS, buy: buyUpgrade, start: startGame, pick: pickBoon,
  step: function (dt) { update(dt); }, cost: function (k) { return upgradeCost(UPGRADES[k]); },
  fireRadius: fireRadius, carryCap: carryCap, endless: continueEndless
};

</script>
</body>
</html>
